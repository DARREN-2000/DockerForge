  </g>
  <text x="250" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="bold" fill="#ffffff">DockerForge</text>
  <text x="250" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="300" fill="#94a3b8">The Deep Analyzer Engine and Auto Remediation Loop.</text>
  <text x="250" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#64748b">Zero config. AST-based. Deterministic.</text>

  <!-- Decorative Code Blocks -->
  <g transform="translate(850, 100)">
    <rect width="250" height="150" fill="#0f172a" rx="8" stroke="#334155" stroke-width="2" />
    <circle cx="20" cy="20" r="6" fill="#ef4444" />
    <circle cx="40" cy="20" r="6" fill="#eab308" />
    <circle cx="60" cy="20" r="6" fill="#22c55e" />
    <text x="20" y="60" font-family="monospace" font-size="14" fill="#3b82f6">dockerforge</text>
    <text x="120" y="60" font-family="monospace" font-size="14" fill="#e2e8f0">analyze</text>
    <text x="20" y="90" font-family="monospace" font-size="14" fill="#3b82f6">dockerforge</text>
    <text x="120" y="90" font-family="monospace" font-size="14" fill="#e2e8f0">generate</text>
    <text x="20" y="120" font-family="monospace" font-size="14" fill="#3b82f6">dockerforge</text>
    <text x="120" y="120" font-family="monospace" font-size="14" fill="#e2e8f0">remediate</text>
