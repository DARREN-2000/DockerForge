<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)" rx="16" />
  <g transform="translate(100, 80)">
    <path d="M 0 50 L 50 0 L 100 50 L 50 100 Z" fill="url(#accent)" opacity="0.8" />
    <path d="M 25 75 L 75 25" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
