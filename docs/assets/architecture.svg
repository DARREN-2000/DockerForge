<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="12" />

  <!-- Title -->
  <text x="400" y="50" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle">DockerForge Pipeline</text>

  <!-- Nodes -->
  <g filter="url(#shadow)">
    <rect x="50" y="100" width="180" height="80" rx="8" fill="#3b82f6" />
    <text x="140" y="145" font-family="system-ui" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">AST Analyzer</text>

    <rect x="310" y="100" width="180" height="80" rx="8" fill="#8b5cf6" />
    <text x="400" y="145" font-family="system-ui" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Tracer</text>

    <rect x="570" y="100" width="180" height="80" rx="8" fill="#10b981" />
    <text x="660" y="145" font-family="system-ui" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Generator</text>

    <rect x="310" y="250" width="180" height="80" rx="8" fill="#f59e0b" />
    <text x="400" y="295" font-family="system-ui" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Orchestrator</text>

    <rect x="310" y="400" width="180" height="80" rx="8" fill="#ef4444" />
    <text x="400" y="445" font-family="system-ui" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Remediation Engine</text>
  </g>

  <!-- Edges -->
  <g stroke="#94a3b8" stroke-width="3" fill="none" stroke-linejoin="round">
    <path d="M 230 140 L 300 140" marker-end="url(#arrow)" />
    <path d="M 490 140 L 560 140" marker-end="url(#arrow)" />
    <path d="M 660 180 L 660 290 L 500 290" marker-end="url(#arrow)" />
    <path d="M 400 330 L 400 390" marker-end="url(#arrow)" />
    <path d="M 310 440 L 250 440 L 250 290 L 300 290" marker-end="url(#arrow)" />
  </g>

  <!-- Labels -->
  <text x="265" y="130" font-family="system-ui" font-size="12" fill="#cbd5e1" text-anchor="middle">Imports</text>
  <text x="525" y="130" font-family="system-ui" font-size="12" fill="#cbd5e1" text-anchor="middle">Graph</text>
  <text x="580" y="280" font-family="system-ui" font-size="12" fill="#cbd5e1" text-anchor="middle">Dockerfile</text>
  <text x="440" y="370" font-family="system-ui" font-size="12" fill="#cbd5e1">Build Fails</text>
  <text x="200" y="380" font-family="system-ui" font-size="12" fill="#cbd5e1">Patches</text>

  <!-- Arrow Marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>
</svg>
